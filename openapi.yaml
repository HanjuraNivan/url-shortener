openapi: 3.0.4
info:
  title: URL Shortener API
  description: An API for shortening URLs and retrieving original URLs.
  version: 1.0.0
paths:
  /shorten:
    post:
      summary: Shorten a URL
      operationId: ShortenURL
      requestBody:
        description: The URL to be shortened.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: The original URL to be shortened.
              required:
                - url
      responses:
        '200':
          description: Successfully shortened the URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shortUrl:
                    type: string
                    format: uri
                    description: The shortened URL.
        '400':
          description: Invalid input, URL is not valid.
  /fullURL:
    get:
      summary: Retrieve the original URL from a shortened URL
      operationId: GetOriginalURL
      parameters:
        - in: query
          name: shortUrl
          schema:
            type: string
            format: uri
          required: true
          description: The shortened URL to retrieve the original URL for.
      responses:
        '200':
          description: Successfully retrieved the original URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  originalUrl:
                    type: string
                    format: uri
                    description: The original URL corresponding to the shortened URL.
        '404':
          description: Shortened URL not found.
  /{shortenedURL}:
    get:
      summary: Redirects to the original url
      operationId : RedirectToOriginalUrl
      parameters:
          - in: path
            name: shortenedURL
            schema:
              type: string
            required: true
            description: The shortened URL to retrieve the original URL for.
      responses:
          '302':
            description: Successfully redirected.
          '400':
            description: Invalid input, URL is not valid.
  /clickedTimes/{shortenedURL}:
    get:
      summary: Gets you the count of how manytimes a url is clicked
      operationId: GetUrlClicks
      parameters:
          - in: path
            name: shortenedURL
            schema:
              type: string
            required: true
            description: The shortened URL to retrieve the original URL for.
      responses:
            '200':
              description: Successfully redirected.
              content:
                application/json:
                  schema:
                  type: object
                  properties:
                    count:
                      type: number
                      description: The clicked count of the short url.
            '400':
              description: Invalid input, shortcode is not valid.
            '404':
              description: Short code not found
